# Copy this file to .github/workflows/privacy-review.yml in the repo you want reviewed,
# then add an ANTHROPIC_API_KEY secret (Settings -> Secrets and variables -> Actions).
name: Privacy review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: taismartinezz/privacy-reviewer@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fail-on: never # change to "high" to block merges on serious findings
