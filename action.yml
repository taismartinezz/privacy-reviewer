name: Privacy Reviewer
description: An LLM agent that reviews pull requests for privacy and security risks and comments on the PR.
branding:
  icon: lock
  color: purple

inputs:
  anthropic-api-key:
    description: Anthropic API key. If empty, the review is skipped.
    required: false
  github-token:
    description: Token used to read the PR and post the comment.
    required: false
    default: ${{ github.token }}
  model:
    description: Claude model to use.
    required: false
    default: claude-sonnet-5-5
  fail-on:
    description: Fail the check on findings at or above this severity (high, medium, low, never).
    required: false
    default: never
  max-turns:
    description: Maximum agent turns before it must submit a review.
    required: false
    default: "10"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install reviewer
      shell: bash
      run: pip install -q -r "${{ github.action_path }}/requirements.txt"
    - name: Review pull request
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PYTHONPATH: ${{ github.action_path }}
      run: |
        python -m privacy_reviewer \
          --pr "${{ github.event.pull_request.number }}" \
          --repo-root "${{ github.workspace }}" \
          --model "${{ inputs.model }}" \
          --max-turns "${{ inputs.max-turns }}" \
          --fail-on "${{ inputs.fail-on }}"
